# Shothik Backend Services - Docker Compose
# 
# Run all backend microservices with:
#   docker-compose -f docker-compose.backend.yml up -d
#
# Services:
#   - Redis (caching, queues)
#   - Research Service (multi-source research)
#   - Animation Service (video generation)

version: '3.8'

services:
  # ============================================================================
  # Redis - Caching and Job Queues
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: shothik-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shothik-backend

  # ============================================================================
  # Research Service - Multi-source Academic Research
  # ============================================================================
  research-service:
    build:
      context: ./backend-services/research-service
      dockerfile: Dockerfile
    container_name: shothik-research-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shothik-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # Animation Service - Video Generation
  # ============================================================================
  animation-service:
    build:
      context: ./backend-services/animation-service
      dockerfile: Dockerfile
    container_name: shothik-animation-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - SUNO_API_KEY=${SUNO_API_KEY}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - shothik-backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # Nginx - API Gateway / Load Balancer
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: shothik-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - research-service
      - animation-service
    networks:
      - shothik-backend

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis-data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  shothik-backend:
    driver: bridge
